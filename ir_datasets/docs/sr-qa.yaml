_:
  pretty_name: 'SR-QA'
  desc: '
<p>
SR-QA is a test collection for evidence finding in full-text studies, built from the per-study
data-extraction tables of CC BY systematic reviews. Each query is a question about one included
study; the review authors'' own answer, copied verbatim from their table, is the gold, and passages
of the study''s CC BY full text (PubMed Central) are labelled relevant when they contain that
answer. No gold answer and no relevance label is generated by a model.
</p>
<p>
The task is <b>within-paper retrieval</b>: a data extractor already has the study open and needs
to find where a value is reported. Each query''s <kbd>pmcid</kbd> names its study, and only that
paper''s passages should be ranked (questions do not name their study, so ranking the whole corpus
is not well posed). <kbd>scoreddocs</kbd> lists exactly these candidates for each query: every
passage of its paper, in document order, all with score 0 (a candidate set, not a ranking).
</p>
<p>
Passages are prose sentences, table data rows, table cells that hold a number (with their row and
column headers), and captions or footnotes. Labels are graded: 2 when the passage contains a gold
fragment as a whole phrase, 1 when it contains every distinctive number of a fragment. The labels
were checked by hand: precision is high, but they miss some relevant passages (values the paper
words differently from the review), so scores computed on them are lower bounds.
</p>
<p>
Splits are cut on each review''s online publication date. <a class="ds-ref">sr-qa/test-2026</a>
holds reviews that went online in 2026, after the training cutoff of models released before 2026.
The release on Zenodo also contains the grounded question-answering items, full texts, table maps
and baseline runs.
</p>
<ul>
  <li>Documents: passages of CC BY full-text studies</li>
  <li>Queries: questions from systematic-review extraction tables</li>
  <li><a href="https://doi.org/10.5281/zenodo.23432598">Dataset on Zenodo (CC BY 4.0)</a></li>
</ul>
'
  bibtex_ids: ['Akinseloyin2026SrQa']

train-2025:
  desc: '
<p>
Training split: reviews that went online in 2025. Some papers (213) also appear in
<a class="ds-ref">sr-qa/train-2026</a>, by design; no paper of an evaluation split appears here.
</p>'
  bibtex_ids: ['Akinseloyin2026SrQa']

train-2026:
  desc: '
<p>
Training split: reviews that went online in 2026 and are not in the development or test splits.
Some papers (213) also appear in <a class="ds-ref">sr-qa/train-2025</a>, by design.
</p>'
  bibtex_ids: ['Akinseloyin2026SrQa']

dev-2026:
  desc: '
<p>
Development split: reviews that went online in 2026.
</p>'
  bibtex_ids: ['Akinseloyin2026SrQa']

test-2026:
  desc: '
<p>
The headline test split: 539 reviews that went online between 2 January and 28 June 2026, after
the training cutoff of models released before 2026. No source paper of an evaluation split
appears in any other split.
</p>'
  bibtex_ids: ['Akinseloyin2026SrQa']

test-2025:
  desc: '
<p>
A second test split, from 2025 reviews; almost all of them went online late in 2025, so it is a
bounded contrast to <a class="ds-ref">sr-qa/test-2026</a>, not a pre-cutoff set.
</p>'
  bibtex_ids: ['Akinseloyin2026SrQa']
